<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WES 任务调度模拟器 v2.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               background: #0f172a; color: #e2e8f0; }
        .header { background: linear-gradient(135deg, #1e3a5f 0%, #2b5c8f 100%);
                  padding: 20px 32px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header h1 { font-size: 22px; }
        .header .subtitle { font-size: 13px; opacity: 0.7; margin-top: 4px; }
        .header .badge { display: inline-block; padding: 2px 8px; border-radius: 4px;
                         background: #22c55e; color: #fff; font-size: 11px; margin-left: 8px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 16px; }

        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
        .stat-card { background: #1e293b; border-radius: 10px; padding: 16px; text-align: center;
                     border: 1px solid #334155; }
        .stat-card .number { font-size: 28px; font-weight: 700; color: #60a5fa; }
        .stat-card .label { font-size: 11px; color: #94a3b8; margin-top: 4px; }

        .section { background: #1e293b; border-radius: 10px; padding: 16px; margin-bottom: 14px;
                    border: 1px solid #334155; }
        .section h2 { font-size: 14px; margin-bottom: 12px; color: #93c5fd;
                       border-left: 3px solid #3b82f6; padding-left: 10px;
                       display: flex; align-items: center; gap: 8px; }
        .section h2 .count { font-size: 11px; color: #64748b; font-weight: normal; }

        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { background: #334155; padding: 8px 10px; text-align: left; font-weight: 600; color: #94a3b8; }
        td { padding: 6px 10px; border-top: 1px solid #2d3a4e; color: #cbd5e1; }

        .badge { display: inline-block; padding: 2px 7px; border-radius: 3px; font-size: 10px; font-weight: 600; }
        .badge-idle { background: #065f46; color: #6ee7b7; }
        .badge-busy { background: #78350f; color: #fcd34d; }
        .badge-fault { background: #7f1d1d; color: #fca5a5; }
        .badge-urgent { background: #7f1d1d; color: #fca5a5; }
        .badge-high { background: #78350f; color: #fcd34d; }
        .badge-normal { background: #064e3b; color: #6ee7b7; }
        .badge-low { background: #1e293b; color: #64748b; border: 1px solid #334155; }

        .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .btn { padding: 7px 14px; border: none; border-radius: 6px; font-size: 12px; cursor: pointer;
               background: #3b82f6; color: #fff; transition: all 0.2s; font-weight: 500; }
        .btn:hover { background: #2563eb; }
        .btn-green { background: #16a34a; }
        .btn-green:hover { background: #15803d; }
        .btn-amber { background: #d97706; }
        .btn-amber:hover { background: #b45309; }
        .btn-outline { background: transparent; border: 1px solid #475569; color: #94a3b8; }
        .btn-outline:hover { background: #334155; color: #e2e8f0; }
        .btn.active { background: #dc2626; }
        .btn.active:hover { background: #b91c1c; }

        .row { display: flex; gap: 14px; }
        .col { flex: 1; min-width: 0; }

        .device-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .dot-idle { background: #22c55e; box-shadow: 0 0 4px #22c55e; }
        .dot-busy { background: #eab308; box-shadow: 0 0 4px #eab308; }
        .dot-fault { background: #ef4444; box-shadow: 0 0 4px #ef4444; }

        .event-log { max-height: 200px; overflow-y: auto; font-size: 11px; font-family: monospace; }
        .event-log .entry { padding: 3px 8px; border-bottom: 1px solid #2d3a4e; }
        .event-log .entry .time { color: #64748b; margin-right: 8px; }
        .event-log .entry .evt { color: #60a5fa; }
        .ws-status { display: inline-flex; align-items: center; gap: 4px;
                      font-size: 11px; padding: 2px 8px; border-radius: 10px; }
        .ws-connected { background: #065f46; color: #6ee7b7; }
        .ws-disconnected { background: #7f1d1d; color: #fca5a5; }

        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
            .row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏭 WES 任务调度模拟器 <span class="badge">v2.0</span></h1>
        <div class="subtitle">
            Warehouse Execution System · 优先级队列 + 设备分配 + Redis持久化 + WebSocket实时推送
            <span class="ws-status ws-disconnected" id="wsStatus">🔴 未连接</span>
        </div>
    </div>
    <div class="container">
        <div class="toolbar">
            <button class="btn btn-green" onclick="generateTasks(10)">➕ 生成10个任务</button>
            <button class="btn btn-green" onclick="generateTasks(50)">➕ 生成50个任务</button>
            <button class="btn btn-amber" onclick="refresh()">🔄 刷新</button>
            <button class="btn btn-outline" id="autoBtn" onclick="toggleAuto()">▶ 自动刷新</button>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="number" id="queueSize">0</div><div class="label">📥 等待队列</div></div>
            <div class="stat-card"><div class="number" id="processingCount">0</div><div class="label">⚡ 执行中</div></div>
            <div class="stat-card"><div class="number" id="totalDispatched">0</div><div class="label">🚀 已分配</div></div>
            <div class="stat-card"><div class="number" id="totalCompleted">0</div><div class="label">✅ 已完成</div></div>
            <div class="stat-card"><div class="number" id="totalTimeout">0</div><div class="label">⏰ 超时</div></div>
        </div>

        <div class="row">
            <div class="col">
                <div class="section">
                    <h2>🔧 设备状态 <span class="count" id="workerCount">0台</span></h2>
                    <div style="overflow-x:auto">
                    <table><thead><tr>
                        <th>设备</th><th>类型</th><th>状态</th><th>区域</th><th>效率</th><th>当前任务</th>
                    </tr></thead><tbody id="workerTable"></tbody></table>
                    </div>
                </div>
                <div class="section">
                    <h2>⚡ 执行中 <span class="count" id="processingCountLabel">0</span></h2>
                    <div style="overflow-x:auto">
                    <table><thead><tr>
                        <th>ID</th><th>类型</th><th>优先级</th><th>路径</th>
                    </tr></thead><tbody id="processingTable"></tbody></table>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="section">
                    <h2>📋 实时事件日志</h2>
                    <div class="event-log" id="eventLog">
                        <div class="entry"><span class="time">-</span>等待事件推送...</div>
                    </div>
                </div>
                <div class="section">
                    <h2>📊 最新完成 <span class="count" id="completedCountLabel">0</span></h2>
                    <div style="overflow-x:auto">
                    <table><thead><tr>
                        <th>类型</th><th>优先级</th><th>路径</th><th>SKU</th>
                    </tr></thead><tbody id="completedTable"></tbody></table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let autoTimer = null;
        let ws = null;
        let eventCount = 0;

        // === WebSocket ===
        function connectWS() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(proto + '//' + location.host + '/ws/dispatch');
            ws.onopen = () => {
                document.getElementById('wsStatus').innerHTML = '🟢 已连接';
                document.getElementById('wsStatus').className = 'ws-status ws-connected';
                addEvent('WS_CONNECT', 'WebSocket 已连接');
            };
            ws.onclose = () => {
                document.getElementById('wsStatus').innerHTML = '🔴 未连接';
                document.getElementById('wsStatus').className = 'ws-status ws-disconnected';
                setTimeout(connectWS, 3000);
            };
            ws.onmessage = (e) => {
                try {
                    const msg = JSON.parse(e.data);
                    if (msg.type) {
                        addEvent(msg.type, formatEventData(msg));
                    }
                    if (msg.stats) {
                        updateStats(msg.stats);
                    }
                } catch(err) {}
            };
        }

        function formatEventData(msg) {
            if (msg.type === 'TASK_DISPATCH' && msg.data) {
                const t = msg.data.task || {};
                const w = msg.data.worker || {};
                return `${t.id} → ${w.name}`;
            }
            if (msg.type === 'TASK_COMPLETE' && msg.data) {
                const t = msg.data.task || {};
                return `${t.id} 耗时${msg.data.elapsedMs || '?'}ms`;
            }
            return '';
        }

        // === REST API ===
        async function refresh() {
            try {
                const res = await fetch('/api/wes/status');
                const data = await res.json();
                renderAll(data);
            } catch(e) {
                console.error('刷新失败', e);
            }
        }

        function renderAll(data) {
            updateStats({
                queueSize: data.queueSize,
                processingCount: data.processingCount,
                totalDispatched: data.totalDispatched || 0,
                totalCompleted: data.totalCompleted || 0,
                totalTimeout: data.totalTimeout || 0
            });

            // 设备
            const wt = document.getElementById('workerTable');
            wt.innerHTML = (data.workers || []).map(w => {
                const dotCls = w.status === 'IDLE' ? 'dot-idle' : w.status === 'BUSY' ? 'dot-busy' : 'dot-fault';
                const badgeCls = w.status === 'IDLE' ? 'badge-idle' : w.status === 'BUSY' ? 'badge-busy' : 'badge-fault';
                return `<tr>
                    <td><span class="device-dot ${dotCls}"></span>${w.name}</td>
                    <td>${w.type}</td>
                    <td><span class="badge ${badgeCls}">${w.status}</span></td>
                    <td>${w.zone}</td>
                    <td>${(w.efficiency * 100).toFixed(0)}%</td>
                    <td style="font-size:10px;color:#64748b">${w.currentTaskId || '-'}</td>
                </tr>`;
            }).join('');
            document.getElementById('workerCount').textContent = (data.workers || []).length + '台';

            // 执行中
            document.getElementById('processingCountLabel').textContent = (data.processingTasks || []).length;
            const pt = document.getElementById('processingTable');
            pt.innerHTML = (data.processingTasks || []).map(t => {
                const priCls = t.priority === 'URGENT' ? 'badge-urgent' : t.priority === 'HIGH' ? 'badge-high' : t.priority === 'LOW' ? 'badge-low' : 'badge-normal';
                return `<tr>
                    <td style="font-size:10px;color:#64748b">${t.id}</td>
                    <td>${t.type}</td>
                    <td><span class="badge ${priCls}">${t.priority}</span></td>
                    <td style="font-size:11px">${t.sourceLocation || '?'} → ${t.targetLocation || '?'}</td>
                </tr>`;
            }).join('');

            // 已完成
            const ct = document.getElementById('completedTable');
            const completed = (data.completedTasks || []).slice(-20).reverse();
            document.getElementById('completedCountLabel').textContent = completed.length;
            ct.innerHTML = completed.map(t => {
                return `<tr>
                    <td>${t.type}</td>
                    <td><span class="badge badge-normal">${t.priority}</span></td>
                    <td style="font-size:11px">${t.sourceLocation || '?'} → ${t.targetLocation || '?'}</td>
                    <td style="font-size:10px;color:#64748b">${t.sku || '-'}</td>
                </tr>`;
            }).join('');
        }

        function updateStats(s) {
            if (s.queueSize !== undefined) document.getElementById('queueSize').textContent = s.queueSize;
            if (s.processingCount !== undefined) document.getElementById('processingCount').textContent = s.processingCount;
            if (s.totalDispatched !== undefined) document.getElementById('totalDispatched').textContent = s.totalDispatched;
            if (s.totalCompleted !== undefined) document.getElementById('totalCompleted').textContent = s.totalCompleted;
            if (s.totalTimeout !== undefined) document.getElementById('totalTimeout').textContent = s.totalTimeout;
        }

        async function generateTasks(count) {
            try {
                const res = await fetch('/api/wes/tasks/batch?count=' + count, { method: 'POST' });
                const tasks = await res.json();
                addEvent('BATCH_SUBMIT', `批量提交 ${tasks.length} 个任务`);
                await refresh();
            } catch(e) {
                console.error('生成失败', e);
            }
        }

        function addEvent(type, detail) {
            const log = document.getElementById('eventLog');
            eventCount++;
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = 'entry';
            div.innerHTML = `<span class="time">[${time}]</span><span class="evt">${type}</span> ${detail || ''}`;
            log.insertBefore(div, log.firstChild);
            while (log.children.length > 100) {
                log.removeChild(log.lastChild);
            }
        }

        function toggleAuto() {
            const btn = document.getElementById('autoBtn');
            if (autoTimer) {
                clearInterval(autoTimer);
                autoTimer = null;
                btn.textContent = '▶ 自动刷新';
                btn.className = 'btn btn-outline';
            } else {
                autoTimer = setInterval(refresh, 3000);
                btn.textContent = '⏹ 停止刷新';
                btn.className = 'btn btn-outline active';
            }
        }

        // === 启动 ===
        connectWS();
        refresh();
    </script>
</body>
</html>
